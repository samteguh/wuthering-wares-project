name: wuthering_wares
description: Wuthering Wares - Equipment Store Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.1.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  google_sign_in: ^6.1.5
  flutter_secure_storage: ^9.0.0
  cached_network_image: ^3.3.0
  google_fonts: ^6.1.0
